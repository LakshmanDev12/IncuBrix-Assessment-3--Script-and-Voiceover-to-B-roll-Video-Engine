server {
    listen 80;
    server_name localhost;

    # Serve built Vite frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI backend container
    location /v1/ {
        proxy_pass http://backend:8002/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 60M;
    }

    location /health {
        proxy_pass http://backend:8002/health;
    }

    location /ready {
        proxy_pass http://backend:8002/ready;
    }

    location /docs {
        proxy_pass http://backend:8002/docs;
    }

    location /openapi.json {
        proxy_pass http://backend:8002/openapi.json;
    }

    # Proxy output videos from backend shared volume
    location /output/ {
        proxy_pass http://backend:8002/output/;
        proxy_read_timeout 60s;
    }
}
